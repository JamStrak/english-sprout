<!doctype html>
<html lang="zh-CN" data-skin="sunny">
<head>
  <meta charset="UTF-8">
  <meta name="app-build" content="__APP_BUILD__">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EFF1F5">
  <meta name="description" content="每天一个生活短句，听一听、说一说，让英语在生活里慢慢长大。适合4—7岁亲子共学。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="stylesheet" href="./src/interaction.css">
  <link rel="stylesheet" href="./src/avatars.css">
  <link rel="stylesheet" href="./src/feedback.css">
  <link rel="stylesheet" href="./src/voice-audition.css">
  <link rel="stylesheet" href="./src/focus.css">
  <link rel="stylesheet" href="./src/skins.css">
  <link rel="stylesheet" href="./src/dialog.css">
  <link rel="stylesheet" href="./src/garden-play.css">
  <title>英语小芽 · 每天一句，慢慢长大</title>
</head>
<body>
  <div id="app" data-startup="modules"><div class="boot"><span>🌱</span><h1>英语小芽</h1><p>正在打开今天的小世界…</p></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="storage-warning" role="alert" hidden></div>
  <!-- APP_CURRICULUM -->
  <script>
    // This recovery stays available even if a module never reaches the browser.
    (()=>{
      const root=document.getElementById('app');
      function offerRetry(){
        if(root.dataset.startup!=='modules')return;
        root.dataset.startup='modules-error';
        root.querySelector('p').textContent='连接有点慢，小芽还在准备。可以稍等，或点一下再试。';
        const button=document.createElement('button');button.className='primary';button.textContent='再试一次';button.id='retry';button.onclick=()=>location.reload();root.querySelector('.boot').append(button);
      }
      const timer=setTimeout(offerRetry,12000);
      window.addEventListener('sprout-ready',()=>clearTimeout(timer),{once:true});
      window.addEventListener('online',()=>{if(root.dataset.startup==='modules-error')location.reload();});
      window.addEventListener('error',event=>{if(event.target?.id==='app-module'){clearTimeout(timer);offerRetry();}},true);
    })();
  </script>
  <script id="app-module" type="module" src="./src/app.js"></script>
  <noscript>英语小芽需要浏览器启用 JavaScript 才能开始练习。</noscript>
</body>
</html>
