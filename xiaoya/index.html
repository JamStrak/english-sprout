<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EFEADF">
  <meta name="description" content="用声音、动作和生活情境，陪孩子听懂、开口说。">
  <meta name="xiaoya-build" content="__XIAOYA_BUILD__">
  <meta name="xiaoya-version" content="__XIAOYA_VERSION__">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>小芽英语</title>
  <link rel="icon" href="xiaoya/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="xiaoya/icons/icon-192.png">
  <link rel="manifest" href="xiaoya/manifest.webmanifest">
  <link rel="stylesheet" href="xiaoya/style.css">
  <link rel="stylesheet" href="xiaoya/meadow.css">
  <link rel="stylesheet" href="xiaoya/feedback.css">
  <link rel="stylesheet" href="xiaoya/paper.css">
  <link rel="stylesheet" href="xiaoya/economy.css">
</head>
<body>
  <div id="app"></div>
  <noscript>请开启浏览器的脚本功能，再来和小芽一起玩。</noscript>
  <script type="module" src="xiaoya/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(new URL('xiaoya/sw.js', document.baseURI), {scope:new URL('xiaoya/', document.baseURI).pathname, updateViaCache:'none'})
          .then(registration => { window.xiaoyaWorker = registration; registration.update().catch(() => {}); })
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
